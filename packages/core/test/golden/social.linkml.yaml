# Generated by lpg-modeler. Target: linkml.
#
# Every class and slot carries the IRI it has in this model, so identity survives the
# round trip into the LinkML generator ecosystem. Edge types that carry properties are
# reified: LinkML has no binary relation that can hold them.

id: https://example.org/vocab/social
name: social
prefixes:
  linkml: https://w3id.org/linkml/
  social: https://example.org/vocab/social#
default_prefix: social
default_range: string
imports:
  - linkml:types

classes:
  Timestamped:
    mixin: true
    attributes:
      createdAt:
        range: datetime
        required: true
  Car:
    class_uri: social:Car
    attributes:
      vin:
        slot_uri: social:vin
        range: string
        identifier: true
      seats:
        slot_uri: social:seats
        range: integer
  Party:
    class_uri: social:Party
    abstract: true
    attributes:
      id:
        slot_uri: social:id
        range: string
        identifier: true
  Company:
    class_uri: social:Company
    is_a: Party
    attributes:
      vat:
        slot_uri: social:vat
        range: string
  Person:
    class_uri: social:Person
    is_a: Party
    mixins:
      - Timestamped
    unique_keys:
      email_key:
        unique_key_slots:
          - email
    attributes:
      email:
        slot_uri: social:email
        range: string
        required: true
      born:
        slot_uri: social:born
        range: date
      likes:
        slot_uri: social:LIKES
        range: Company
        multivalued: true
  Knows:
    class_uri: social:Knows
    description: Reified from edge type KNOWS, which carries properties.
    attributes:
      knowsSubject:
        range: Person
        required: true
      knowsObject:
        range: Person
        required: true
      since:
        slot_uri: social:since
        range: date
  Owns:
    class_uri: social:Owns
    description: Reified from edge type OWNS, which carries properties.
    attributes:
      ownsSubject:
        range: Party
        required: true
      ownsObject:
        range: Car
        required: true
      since:
        slot_uri: social:since
        range: date
