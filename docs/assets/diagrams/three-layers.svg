<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" width="1040" height="480" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Three layers that all get called semantic. A domain model answers what one application needs, in a closed world. An ontology answers what a term means to anyone, in an open world. A semantic layer answers what number to report. A structural model can generate the first two; the third is decided and owned by people.">
  <rect width="1040" height="480" rx="14" fill="#fcfbf9"/>

  <text x="40" y="46" font-size="19" font-weight="700" fill="#101318">Three things wearing the same name</text>
  <text x="40" y="70" font-size="13.5" fill="#5b6472">All three sit between raw data and human meaning. Each one answers a different question.</text>

  <!-- domain model -->
  <rect x="40" y="100" width="300" height="290" rx="12" fill="#ffffff" stroke="#2f5fe0" stroke-width="1.4"/>
  <path d="M40 112 a12 12 0 0 1 12 -12 H328 a12 12 0 0 1 12 12 V142 H40 z" fill="#eef2fb"/>
  <text x="60" y="128" font-size="15" font-weight="700" fill="#2f5fe0">Domain model</text>
  <text x="60" y="176" font-size="15" font-style="italic" fill="#101318">What does my app need?</text>
  <g font-size="12.5">
    <text x="60" y="220" fill="#8a94a6">WORLD</text>        <text x="160" y="220" fill="#101318">closed</text>
    <text x="60" y="250" fill="#8a94a6">WRITTEN IN</text>   <text x="160" y="250" fill="#101318">classes, tables</text>
    <text x="60" y="280" fill="#8a94a6">OWNED BY</text>     <text x="160" y="280" fill="#101318">one application team</text>
    <text x="60" y="310" fill="#8a94a6">SCOPE</text>        <text x="160" y="310" fill="#101318">one bounded context</text>
  </g>
  <text x="60" y="360" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#5b6472">Order · Customer · Cart</text>

  <!-- ontology -->
  <rect x="370" y="100" width="300" height="290" rx="12" fill="#ffffff" stroke="#7a4de0" stroke-width="1.4"/>
  <path d="M370 112 a12 12 0 0 1 12 -12 H658 a12 12 0 0 1 12 12 V142 H370 z" fill="#f3effd"/>
  <text x="390" y="128" font-size="15" font-weight="700" fill="#7a4de0">Ontology</text>
  <text x="390" y="176" font-size="15" font-style="italic" fill="#101318">What does this term mean, to anyone?</text>
  <g font-size="12.5">
    <text x="390" y="220" fill="#8a94a6">WORLD</text>        <text x="490" y="220" fill="#101318">open</text>
    <text x="390" y="250" fill="#8a94a6">WRITTEN IN</text>   <text x="490" y="250" fill="#101318">OWL, validated by SHACL</text>
    <text x="390" y="280" fill="#8a94a6">OWNED BY</text>     <text x="490" y="280" fill="#101318">whoever publishes it</text>
    <text x="390" y="310" fill="#8a94a6">DERIVES</text>      <text x="490" y="310" fill="#101318">facts nobody stated</text>
  </g>
  <text x="390" y="360" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#5b6472">sem:Customer rdfs:subClassOf sem:Actor</text>

  <!-- semantic layer -->
  <rect x="700" y="100" width="300" height="290" rx="12" fill="#ffffff" stroke="#c2761b" stroke-width="1.4"/>
  <path d="M700 112 a12 12 0 0 1 12 -12 H988 a12 12 0 0 1 12 12 V142 H700 z" fill="#fdf6ec"/>
  <text x="720" y="128" font-size="15" font-weight="700" fill="#c2761b">Semantic layer</text>
  <text x="720" y="176" font-size="15" font-style="italic" fill="#101318">What number do we report?</text>
  <g font-size="12.5">
    <text x="720" y="220" fill="#8a94a6">WORLD</text>        <text x="820" y="220" fill="#101318">closed</text>
    <text x="720" y="250" fill="#8a94a6">WRITTEN IN</text>   <text x="820" y="250" fill="#101318">metric definitions</text>
    <text x="720" y="280" fill="#8a94a6">OWNED BY</text>     <text x="820" y="280" fill="#101318">analysts, the business</text>
    <text x="720" y="310" fill="#8a94a6">HOLDS</text>        <text x="820" y="310" fill="#101318">joins, grains, filters</text>
  </g>
  <text x="720" y="360" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#5b6472">Revenue = SUM(orders.amount)</text>

  <!-- what produces each -->
  <g fill="none" stroke-width="1.5">
    <path d="M40 412 V424 H670 V412" stroke="#1d6b3a"/>
    <path d="M700 412 V424 H1000 V412" stroke="#8a94a6" stroke-dasharray="5 4"/>
  </g>
  <rect x="235" y="436" width="240" height="26" rx="13" fill="#eaf6ee" stroke="#b6dcc3"/>
  <text x="355" y="453" font-size="12.5" font-weight="700" fill="#1d6b3a" text-anchor="middle">generated from one .lpg.yaml</text>
  <text x="850" y="453" font-size="12.5" font-weight="700" fill="#5b6472" text-anchor="middle">decided and owned by people</text>
</svg>
