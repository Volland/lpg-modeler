<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="1040" height="440" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif" role="img" aria-label="LTV composed from two metrics. LTV has Revenue as its numerator and CustomerCount as its denominator. Revenue is a sum based on orders.amount, filtered by status equals paid, at a monthly grain on orders.placedAt. CustomerCount is a distinct count based on customers.id.">
  <rect width="1040" height="440" rx="14" fill="#fcfbf9"/>
  <defs>
    <marker id="lg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a94a6"/>
    </marker>
    <marker id="lp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a4de0"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="19" font-weight="700" fill="#101318">LTV = Revenue / CustomerCount</text>
  <text x="40" y="70" font-size="13.5" fill="#5b6472">Two metric nodes that already exist, related by a third. Nothing is written out twice.</text>

  <!-- edges -->
  <g stroke="#7a4de0" stroke-width="1.5" fill="none" marker-end="url(#lp)">
    <path d="M470 160 L336 214"/>
    <path d="M570 160 L704 214"/>
  </g>
  <g stroke="#8a94a6" stroke-width="1.4" fill="none" marker-end="url(#lg)">
    <path d="M232 274 L130 332"/>
    <path d="M290 274 V332"/>
    <path d="M348 274 L452 332"/>
    <path d="M750 274 V332"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="10.5">
    <text x="392" y="176" fill="#7a4de0" text-anchor="end">NUMERATOR</text>
    <text x="648" y="176" fill="#7a4de0">DENOMINATOR</text>
    <text x="172" y="296" fill="#5b6472" text-anchor="end">FILTERED_BY</text>
    <text x="298" y="310" fill="#5b6472">BASED_ON</text>
    <text x="408" y="296" fill="#5b6472">GRAIN</text>
    <text x="758" y="310" fill="#5b6472">BASED_ON</text>
  </g>

  <!-- LTV -->
  <rect x="440" y="100" width="160" height="60" rx="10" fill="#ffffff" stroke="#7a4de0" stroke-width="2"/>
  <text x="520" y="126" font-size="14.5" font-weight="700" fill="#7a4de0" text-anchor="middle">LTV</text>
  <text x="520" y="146" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5b6472" text-anchor="middle">ratio</text>

  <!-- Revenue -->
  <rect x="200" y="214" width="180" height="60" rx="10" fill="#ffffff" stroke="#7a4de0" stroke-width="1.6"/>
  <text x="290" y="240" font-size="14" font-weight="700" fill="#7a4de0" text-anchor="middle">Revenue</text>
  <text x="290" y="260" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5b6472" text-anchor="middle">sum · month</text>

  <!-- CustomerCount -->
  <rect x="660" y="214" width="180" height="60" rx="10" fill="#ffffff" stroke="#7a4de0" stroke-width="1.6"/>
  <text x="750" y="240" font-size="14" font-weight="700" fill="#7a4de0" text-anchor="middle">CustomerCount</text>
  <text x="750" y="260" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5b6472" text-anchor="middle">countDistinct</text>

  <!-- leaves -->
  <rect x="40" y="332" width="150" height="40" rx="8" fill="#f3effd" stroke="#c9b8f2" stroke-width="1.3"/>
  <text x="115" y="357" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7a4de0" text-anchor="middle">status eq paid</text>

  <rect x="215" y="332" width="150" height="40" rx="8" fill="#ffffff" stroke="#2f5fe0" stroke-width="1.3"/>
  <text x="290" y="357" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#2f5fe0" text-anchor="middle">orders.amount</text>

  <rect x="390" y="332" width="150" height="40" rx="8" fill="#ffffff" stroke="#2f5fe0" stroke-width="1.3"/>
  <text x="465" y="357" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#2f5fe0" text-anchor="middle">orders.placedAt</text>

  <rect x="675" y="332" width="150" height="40" rx="8" fill="#ffffff" stroke="#2f5fe0" stroke-width="1.3"/>
  <text x="750" y="357" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#2f5fe0" text-anchor="middle">customers.id</text>

  <!-- note -->
  <rect x="860" y="100" width="140" height="106" rx="9" fill="#ffffff" stroke="#dfe2e7"/>
  <text x="874" y="124" font-size="11.5" font-weight="700" fill="#101318">Change once</text>
  <text x="874" y="144" font-size="11.5" fill="#5b6472">Tighten Revenue's</text>
  <text x="874" y="161" font-size="11.5" fill="#5b6472">filter, and LTV</text>
  <text x="874" y="178" font-size="11.5" fill="#5b6472">follows without</text>
  <text x="874" y="195" font-size="11.5" fill="#5b6472">being touched.</text>

  <g font-size="12">
    <rect x="40" y="396" width="14" height="14" rx="3" fill="#ffffff" stroke="#7a4de0"/>
    <text x="62" y="408" fill="#5b6472">Metric</text>
    <rect x="130" y="396" width="14" height="14" rx="3" fill="#f3effd" stroke="#c9b8f2"/>
    <text x="152" y="408" fill="#5b6472">Filter</text>
    <rect x="214" y="396" width="14" height="14" rx="3" fill="#ffffff" stroke="#2f5fe0"/>
    <text x="236" y="408" fill="#5b6472">Field</text>
  </g>
</svg>
